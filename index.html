<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anbya Daily Bible</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <p id="boot" class="sub">Loading...</p>
  <script>
    (function () {
      var boot = document.getElementById("boot");
      if (location.protocol === "file:") {
        boot.innerHTML = "⚠️ This page cannot run by double-clicking the file.<br>Open it through a local server (for example http://localhost:8000) or put it online with Firebase Hosting. See README.md.";
      } else {
        setTimeout(function () {
          if (boot && !boot.hidden) boot.innerHTML = "⚠️ The page did not start. Check that your Firebase settings are pasted in app.js, then press F12 → Console to see the error.";
        }, 4000);
      }
    })();
  </script>

  <section id="authView" hidden>
    <h1>📖 Ambosh Quiz</h1>
    <p class="sub">Answer 3 questions every day and earn Ambosh!</p>
    <div class="card">
      <p id="authErr" class="err"></p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="authBtn" class="full">Sign in</button>
      <p class="center"><button id="switchBtn" class="link">New here? Make an account</button></p>
    </div>
  </section>

  <section id="quizView" hidden>
    <div class="bar">
      <span id="qCount"></span>
      <span class="coin">🪙 <span id="ambosh">0</span> Ambosh</span>
    </div>
    <div class="card">
      <p id="ref" class="ref ar"></p>
      <p id="verse" class="verse ar"></p>
      <div id="options" class="ar"></div>
      <div id="msg" class="msg"></div>
      <button id="nextBtn" class="full" hidden></button>
    </div>
  </section>

  <section id="resultView" hidden>
    <div class="card">
      <div id="trophy" class="big"></div>
      <h1 id="resultTitle"></h1>
      <p id="resultSub" class="sub"></p>
    </div>
  </section>

  <section id="adminView" hidden>
    <h1>🪙 Anbya's Ambosh</h1>
    <p id="adminSub" class="sub"></p>
    <div class="card">
      <h2>✏️ Add questions</h2>
      <label for="qDate">Day these questions appear</label>
      <input id="qDate" type="date">
      <label for="qText">Questions (3 per day)</label>
      <textarea id="qText" dir="rtl" rows="12" placeholder="مرقس ١ : ١ - ٨&#10;&#10;١- السؤال الأول&#10;* الاختيار الأول&#10;* الاختيار الثاني (صح)&#10;* الاختيار الثالث&#10;&#10;٢- السؤال الثاني&#10;* ...&#10;&#10;٣- السؤال الثالث&#10;* ..."></textarea>
      <div id="qMsg" class="msg"></div>
      <button id="qSave" class="full">Save questions</button>
      <h2>📅 Scheduled days</h2>
      <div id="qList"></div>
    </div>
    <br>
    <div class="card scroll">
      <table>
        <thead><tr><th>Email</th><th>Ambosh</th><th>Last played</th></tr></thead>
        <tbody id="adminRows"></tbody>
      </table>
    </div>
    <p class="center"><button id="refreshBtn">🔄 Refresh</button></p>
  </section>

  <p id="footer" class="center" hidden>
    <button id="signOutBtn" class="link">Sign out</button>
  </p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
